<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統入口</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --accent: #1b4332;
    --accent2: #2d6a4f;
    --text: #1a1814;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 2px 8px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
    --shadow-hover: 0 8px 24px rgba(0,0,0,.13);
    --radius: 16px;
    --sans: 'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--accent);
    color: #fff;
    padding: 0 40px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo { font-size: 18px; font-weight: 700; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
  .header-date { font-size: 12px; color: rgba(255,255,255,.6); }

  /* MAIN */
  .main { max-width: 1100px; margin: 0 auto; padding: 36px 24px 60px; }

  /* WELCOME */
  .welcome {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    border-radius: var(--radius);
    padding: 36px 40px;
    color: #fff;
    margin-bottom: 36px;
    position: relative;
    overflow: hidden;
  }
  .welcome::after {
    content: '🏢';
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 80px;
    opacity: .18;
  }
  .welcome h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .welcome p { font-size: 14px; color: rgba(255,255,255,.75); line-height: 1.7; }

  /* SECTION */
  .section { margin-bottom: 32px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .section-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .section-badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .section-line { flex: 1; height: 1px; background: var(--border); }

  /* CARDS GRID */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px 20px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: transform .18s, box-shadow .18s, border-color .18s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent2);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent2);
    opacity: 0;
    transition: opacity .18s;
  }
  .card:hover::before { opacity: 1; }

  .card-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 14px;
    transition: transform .18s;
  }
  .card:hover .card-icon { transform: scale(1.08); }

  .card-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
  .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .card-url { font-size: 10px; color: #b0b8c1; margin-top: 10px; word-break: break-all; }

  /* ADD CARD */
  .card-add {
    background: var(--bg);
    border: 2px dashed var(--border);
    box-shadow: none;
  }
  .card-add:hover {
    border-color: var(--accent2);
    background: #e8f5ef;
    box-shadow: none;
    transform: none;
  }
  .card-add .card-icon { background: var(--border); color: var(--text-muted); font-size: 24px; }
  .card-add .card-name { color: var(--text-muted); font-weight: 500; }

  /* ICON COLORS */
  .ic-green  { background: #e8f5ef; }
  .ic-blue   { background: #e8f2fb; }
  .ic-amber  { background: #fef3c7; }
  .ic-red    { background: #fdf0ee; }
  .ic-purple { background: #f3e8ff; }
  .ic-teal   { background: #e0f7f4; }

  /* FOOTER */
  .footer { text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); }

  @media (max-width: 600px) {
    .header { padding: 0 20px; }
    .main { padding: 24px 16px 40px; }
    .welcome { padding: 24px 20px; }
    .welcome::after { display: none; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">🏢 企業系統入口</div>
  <div class="header-date" id="hdate"></div>
</div>

<div class="main">

  <div class="welcome">
    <h1>歡迎使用 Leo 的管理系統</h1>
    <p>點選下方卡片進入各系統。如需新增系統，請聯繫管理員。</p>
  </div>

  <!-- 財務系統 -->
  <div class="section">
    <div class="section-header">
      <span class="section-badge">財務系統</span>
      <span class="section-title"></span>
      <span class="section-line"></span>
      <span style="font-size:12px;color:var(--text-muted)">1 個</span>
    </div>
    <div class="cards">

      <a class="card" href="https://boss07012001-hub.github.io/jebb/" target="_blank">
        <div class="card-icon ic-green">📒</div>
        <div class="card-name">企業記帳系統</div>
        <div class="card-desc">收支記錄、財務報表、圖表分析、雲端同步</div>
        <div class="card-url">boss07012001-hub.github.io/jebb/</div>
      </a>

      <!-- 預留位置 -->
      <div class="card card-add" onclick="alert('請聯繫管理員新增系統')">
        <div class="card-icon">＋</div>
        <div class="card-name">新增系統</div>
      </div>

    </div>
  </div>

  <!-- 預留其他分類 -->
  <div class="section">
    <div class="section-header">
      <span class="section-badge">管理系統</span>
      <span class="section-title"></span>
      <span class="section-line"></span>
      <span style="font-size:12px;color:var(--text-muted)">即將推出</span>
    </div>
    <div class="cards">
      <div class="card card-add" onclick="alert('請聯繫管理員新增系統')">
        <div class="card-icon">＋</div>
        <div class="card-name">新增系統</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-badge">行銷系統</span>
      <span class="section-title"></span>
      <span class="section-line"></span>
      <span style="font-size:12px;color:var(--text-muted)">即將推出</span>
    </div>
    <div class="cards">
      <div class="card card-add" onclick="alert('請聯繫管理員新增系統')">
        <div class="card-icon">＋</div>
        <div class="card-name">新增系統</div>
      </div>
    </div>
  </div>

</div>

<div class="footer">© 2026 企業管理系統　｜　由 Claude AI 協助建置</div>

<script>
  const d = new Date();
  document.getElementById('hdate').textContent =
    `${d.getFullYear()}／${d.getMonth()+1}／${d.getDate()}　${['日','一','二','三','四','五','六'][d.getDay()]}`;
</script>
</body>
</html>
